# Tool configuration only; this project is not packaged.
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.md"]  # ruff formats code blocks in Markdown; keep docs as written

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
